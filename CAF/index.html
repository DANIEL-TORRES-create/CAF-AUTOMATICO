<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navisaf · Informes de flota</title>
<style>
:root{
  --azul:#2B4C8C;--azul-osc:#1B3366;--celeste:#5BB5EA;--ambar:#EDB125;
  --bg:#F5F7FA;--panel:#fff;--panel2:#F3F5F9;--texto:#1f2937;--suave:#6b7686;--borde:#e3e8ef;
  --ok:#15803d;--ok-bg:#e6f6ec;--mal:#c62828;--mal-bg:#fdecec;--aviso:#a16207;--aviso-bg:#fef6dc;--info:#1d4ed8;--info-bg:#e8effd;
  --sombra:0 1px 2px rgba(16,24,40,.05);--radio:10px;--side:236px
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--texto);font-size:14.5px;line-height:1.45}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- estructura ---------- */
#shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--borde);color:var(--texto);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;z-index:30}
.marca{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.marca img{height:34px}
.marca b{font-size:13px;letter-spacing:.4px;color:var(--azul-osc);line-height:1.1}
.marca small{display:block;font-weight:400;color:var(--suave);font-size:11px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#46546b;transition:.15s;position:relative}
.nav button:hover{background:var(--panel2);color:var(--azul-osc)}
.nav button.act{background:var(--info-bg);color:var(--azul);font-weight:650}
.nav .cuenta{margin-left:auto;background:var(--mal);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.lado-pie{margin-top:auto;font-size:12px;color:var(--suave);padding:10px 8px;border-top:1px solid var(--borde)}
.vivo{display:inline-flex;align-items:center;gap:6px}
.vivo i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulso 1.8s infinite}
.vivo.caido i{background:var(--mal);animation:none}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.principal{min-width:0;display:flex;flex-direction:column}
.barra-sup{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--borde)}
.barra-sup h1{font-size:19px;margin:0;font-weight:700;color:var(--texto)}
.buscador{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:0 10px;min-width:220px;max-width:340px;flex:1}
.buscador input{border:0;background:none;outline:0;padding:9px 0;width:100%;color:var(--texto);font:inherit}
.buscador kbd{font-size:11px;color:var(--suave);border:1px solid var(--borde);border-radius:5px;padding:0 5px}
.ib{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--borde);color:var(--texto);position:relative;transition:.15s}
.ib:hover{border-color:var(--celeste)}
.ib .punto{position:absolute;top:-6px;right:-6px;background:var(--mal);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;min-width:19px;text-align:center}
.ib.campana.tiene{animation:campana 2.4s infinite}
@keyframes campana{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(14deg)}96%{transform:rotate(-12deg)}}
.menu-mov{display:none}
main{padding:22px 24px 60px;max-width:none;width:100%;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- indicadores de carga ---------- */
.btn.cargando{pointer-events:none;opacity:.85}
.cargando{pointer-events:none}
.filtros button.cargando,.kpi.cargando,.ib.cargando,tr.cargando{opacity:.7}
.nav button.cargando{opacity:.8}
.rueda{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;flex:none;vertical-align:-2px;margin-right:6px}
.btn .rueda,.nav .rueda,.ib .rueda{margin-right:0}
.btn .rueda{margin-right:2px}
.rueda.grande{width:34px;height:34px;border-width:3px;color:var(--azul);margin:0}
@keyframes gira{to{transform:rotate(360deg)}}
.cargando-pantalla{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:46px 10px;color:var(--suave);font-weight:600}
.err{color:var(--mal);font-size:13px;margin-top:8px}
.periodo-info{background:var(--panel2);border:1px solid var(--borde);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:13.5px}
/* ---------- componentes ---------- */
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila.sep{justify-content:space-between}
.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;box-shadow:var(--sombra);margin-bottom:16px}
.tarjeta h2,.sec-t{margin:0 0 12px;font-size:15px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--borde);border-radius:var(--radio);padding:14px 16px;box-shadow:var(--sombra);display:flex;gap:12px;align-items:center;transition:.2s;cursor:default}
.kpi.clic{cursor:pointer}.kpi.clic:hover{border-color:var(--celeste)}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi{min-width:0}.kpi .n{font-size:26px;font-weight:750;line-height:1}
.kpi .l{font-size:12px;color:var(--suave);margin-top:3px}
.c-azul{background:var(--info-bg);color:var(--info)}.c-ok{background:var(--ok-bg);color:var(--ok)}.c-mal{background:var(--mal-bg);color:var(--mal)}.c-aviso{background:var(--aviso-bg);color:var(--aviso)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;background:var(--azul);color:#fff;font-weight:600;font-size:14px;transition:.15s;box-sizing:border-box}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--panel);color:var(--azul);border:1px solid var(--borde)}
.btn.ambar{background:var(--ambar);color:#1c2433}.btn.verde{background:var(--ok)}.btn.rojo{background:var(--mal)}
.btn.chico{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
input,select,textarea{font:inherit;color:var(--texto);background:var(--panel);border:1px solid var(--borde);border-radius:9px;padding:8px 10px;max-width:100%;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--celeste);box-shadow:0 0 0 3px rgba(91,181,234,.25)}
textarea{width:100%;min-height:84px}
label{display:block;font-size:12.5px;color:var(--suave);margin:10px 0 4px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
.cols input,.cols select{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:650;background:var(--panel2);color:var(--suave);border:1px solid var(--borde);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.chip.mal{background:var(--mal-bg);color:var(--mal);border-color:transparent}.chip.aviso{background:var(--aviso-bg);color:var(--aviso);border-color:transparent}.chip.azul{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.pulso::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:parp 1.2s infinite}
@keyframes parp{50%{opacity:.25}}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{all:unset;cursor:pointer;padding:6px 12px;border-radius:20px;border:1px solid var(--borde);background:var(--panel);font-size:13px;font-weight:600;color:var(--suave);transition:.15s}
.filtros button:hover{border-color:var(--celeste)}
.filtros button.act{background:var(--azul);color:#fff;border-color:var(--azul)}
.tabla-wrap{overflow:auto;background:var(--panel);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--borde);vertical-align:middle}
th{background:var(--panel2);color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;white-space:nowrap}
tbody tr{transition:.12s}tr.clic{cursor:pointer}tr.clic:hover{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.msg{padding:11px 13px;border-radius:10px;margin:8px 0;font-size:14px;white-space:pre-wrap;border:1px solid transparent}
.msg.ok{background:var(--ok-bg);color:var(--ok);font-weight:650}.msg.mal{background:var(--mal-bg);color:var(--mal)}.msg.aviso{background:var(--aviso-bg);color:var(--aviso)}.msg.info{background:var(--info-bg);color:var(--info)}
.peq{font-size:12.5px;color:var(--suave)}
.progreso{height:9px;background:var(--panel2);border:1px solid var(--borde);border-radius:6px;overflow:hidden}
.progreso>div{height:100%;background:var(--azul);transition:width .6s}
.progreso.anim>div{background-size:30px 30px;background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);animation:rayas 1s linear infinite}
@keyframes rayas{to{background-position:30px 0}}
/* clientes en tarjetas */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.cli{background:var(--panel);border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.cli:hover{border-color:var(--celeste)}
.cli.mal{border-color:var(--mal)}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px;flex:none}
.cli h3{margin:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cli .fila>div:nth-child(2){min-width:0;flex:1}.cli .chip{flex:none}.cli .sub{font-size:12.5px;color:var(--suave)}
.dato{display:flex;justify-content:space-between;font-size:13px;color:var(--suave)}.dato b{color:var(--texto);font-weight:650}
.barra-u{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--panel2);border:1px solid var(--borde)}
.barra-u i{display:block;height:100%}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
/* check enviado */
.check{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:inline-grid;place-items:center;flex:none}
.check svg{width:14px;height:14px;stroke-width:3}
.check.grande{width:64px;height:64px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.check.grande svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* pasos */
.pasos{display:flex;gap:0;margin:6px 0 14px}
.paso{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:12px;color:var(--suave);text-align:center}
.paso::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--borde);z-index:0}
.paso:first-child::before{display:none}
.paso.hecho::before,.paso.act::before{background:var(--ok)}
.paso .b{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:2px solid var(--borde);display:grid;place-items:center;z-index:1;font-weight:700}
.paso.hecho .b{background:var(--ok);border-color:var(--ok);color:#fff}
.paso.act .b{border-color:var(--celeste);color:var(--azul);animation:parp 1.3s infinite}
.paso.mal .b{background:var(--mal);border-color:var(--mal);color:#fff}
.paso .aqui{font-size:11px;font-weight:700;color:var(--azul);background:var(--info-bg);border-radius:10px;padding:1px 9px;white-space:nowrap}
.paso.actual{color:var(--texto);font-weight:700}
.siguiente{border:1px solid var(--borde);border-left:4px solid var(--ambar);background:var(--panel2);border-radius:12px;padding:14px 16px;margin:12px 0}
.siguiente.ok{border-left-color:var(--ok)}.siguiente.espera{border-left-color:var(--celeste)}
.siguiente .t{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);margin-bottom:4px}
.siguiente .x{margin-bottom:10px;font-size:14px}
.btn.grande{padding:12px 24px;font-size:15px}
details.mas{margin:6px 0 12px}details.mas>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--azul);padding:4px 0}
details.mas .fila{margin-top:8px}
.prob{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:4px 0}

.paso.hecho,.paso.act,.paso.mal{color:var(--texto);font-weight:600}
/* modales, cajón y avisos */
.velo{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:60;animation:vel .18s}
@keyframes vel{from{opacity:0}}
.modal{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:980px;margin:auto;box-shadow:0 20px 50px rgba(16,24,40,.25);animation:sube .22s cubic-bezier(.2,.9,.3,1)}
@keyframes sube{from{opacity:0;transform:translateY(18px) scale(.98)}}
.modal.chico{max-width:440px}.modal.ancho{max-width:1120px}.f_rmax,.f_rmin{width:72px}.f_placa{width:112px}.modal.medio{max-width:720px}
.modal h3{margin:0 0 12px;font-size:18px;color:var(--texto)}
.pie-modal{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.cajon{position:fixed;top:0;right:0;height:100vh;width:min(430px,100vw);background:var(--panel);z-index:55;box-shadow:-10px 0 30px rgba(16,24,40,.15);transform:translateX(105%);transition:.28s;display:flex;flex-direction:column}
.cajon.abierto{transform:none}
.cajon header{padding:16px 18px;border-bottom:1px solid var(--borde);display:flex;align-items:center;justify-content:space-between}
.cajon .cuerpo{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.aviso-i{border:1px solid var(--borde);border-left:4px solid var(--mal);border-radius:10px;padding:11px 12px;background:var(--panel2);animation:entra .25s both}
.aviso-i.aviso{border-left-color:var(--ambar)}
.aviso-i b{display:block;margin-bottom:2px}
.aviso-i .t{font-size:13px;color:var(--suave)}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(380px,92vw)}
.toast{background:#fff;color:var(--texto);border:1px solid var(--borde);padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.15);display:flex;gap:10px;align-items:flex-start;animation:sube .25s;border-left:4px solid var(--celeste)}
.toast.ok{border-left-color:var(--ok)}.toast.mal{border-left-color:var(--mal)}
.esq{background:linear-gradient(100deg,var(--panel2) 30%,var(--borde) 50%,var(--panel2) 70%);background-size:300% 100%;animation:esq 1.2s infinite;border-radius:var(--radio);height:130px}
@keyframes esq{to{background-position:-150% 0}}
.vacio{text-align:center;color:var(--suave);padding:40px 10px}
/* guía */
.g-paso{display:flex;gap:14px;background:var(--panel);border:1px solid var(--borde);border-radius:var(--radio);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sombra);transition:.2s}
.g-paso.hecho{opacity:.6;border-color:var(--ok)}
.g-num{width:34px;height:34px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.g-paso.hecho .g-num{background:var(--ok)}
.g-paso h4{margin:2px 0 6px;font-size:15px}
.g-paso p,.g-paso li{margin:4px 0;color:var(--texto)}
.g-paso ul{margin:6px 0 0;padding-left:20px}
.g-paso code,.guia code{background:var(--panel2);border:1px solid var(--borde);border-radius:6px;padding:1px 6px;font-size:13px}
.g-chk{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave);white-space:nowrap;align-self:flex-start;cursor:pointer}
.g-chk input{width:18px;height:18px;accent-color:var(--ok)}
.nota{border-left:4px solid var(--ambar);background:var(--aviso-bg);color:var(--texto);padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13.5px}
.nota.info{border-left-color:var(--celeste);background:var(--info-bg)}
.nota.mal{border-left-color:var(--mal);background:var(--mal-bg)}
@media(max-width:900px){
  #shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.25s;width:var(--side)}
  aside.abierto{transform:none;box-shadow:10px 0 30px rgba(16,24,40,.2)}
  .menu-mov{display:grid}
  .barra-sup{padding:10px 14px;flex-wrap:wrap}.buscador{order:9;max-width:none;flex-basis:100%;margin-left:0}
  main{padding:16px 14px 60px}
}
</style>
</head>
<body>
<div id="shell">
  <aside id="lado">
    <div class="marca"><img src="logo.png" alt="Navisaf" onerror="this.style.display='none'"><b>INFORMES<br>DE FLOTA<small>Navisaf</small></b></div>
    <nav class="nav" id="nav"></nav>
    <div class="lado-pie"><span class="vivo" id="vivo"><i></i><span id="vivoT">Conectando…</span></span></div>
  </aside>
  <div class="principal">
    <div class="barra-sup">
      <button class="ib menu-mov" data-act="menu" title="Menú"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="titulo">Clientes</h1>
      <label class="buscador" id="buscador"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar…" autocomplete="off"><kbd>/</kbd></label>
      <button class="ib campana" id="campana" data-act="avisos" title="Avisos"><svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 8H4c0-1 2-2 2-8zM10 21h4"/></svg><span class="punto" id="punto" style="display:none">0</span></button>
    </div>
    <main id="app"></main>
  </div>
</div>
<div class="cajon" id="cajon"><header><b style="font-size:16px">Avisos que requieren atención</b><button class="ib" data-act="avisos"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header><div class="cuerpo" id="avisosLista"></div></div>
<div id="modales"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN: pega aquí la URL de la aplicación web (termina en /exec)
   ===================================================================== */
var URL_API = 'https://script.google.com/macros/s/AKfycbyQ9BDGpHYLnyAZXgNQs1HhB9OTTXP9NTr62fiSMXGWKkWLg1ly8bELZ8c1PSZJ340Erg/exec';
/* ===================================================================== */

/* ---------- utilidades ---------- */
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function n(v) { return v === undefined || v === null || v === '' || isNaN(Number(v)) ? '—' : (Math.round(Number(v) * 100) / 100).toLocaleString('es-PE'); }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
var ICO = {
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',

var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function limaHoy() { var d = new Date(Date.now() - 5 * 3600 * 1000); return { a: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
function periodosCerrados(tipo) {
  var h = limaHoy(), lista = [], a = h.a, m = h.m;
  for (var k = 0; k < 14; k++) {
    var ult = new Date(Date.UTC(a, m, 0)).getUTCDate(), fin = tipo === 'QUINCENAL' ? 15 : ult;
    var cerrado = (a < h.a) || (a === h.a && (m < h.m || (m === h.m && h.d > fin)));
    if (cerrado) lista.push({ a: a, m: m, desde: 1, hasta: fin, ult: ult });

}
/* Semanas cerradas (lunes a domingo), de la más reciente hacia atrás. */

  for (var k = 0; k < 16; k++) {
    var ini = new Date(lunes.getTime() - k * 7 * 86400000), fin = new Date(ini.getTime() + 6 * 86400000);

}
function iso10(d) { return d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1 < 10 ? '0' : '') + (d.getUTCMonth() + 1) + '-' + (d.getUTCDate() < 10 ? '0' : '') + d.getUTCDate(); }
function textoSemana(p) { var c = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return (p.ini.getUTCDate() < 10 ? '0' : '') + p.ini.getUTCDate() + ' ' + c[p.ini.getUTCMonth()] + ' al ' + (p.fin.getUTCDate() < 10 ? '0' : '') + p.fin.getUTCDate() + ' ' + c[p.fin.getUTCMonth()] + ' ' + p.fin.getUTCFullYear(); }
/* Las fechas se guardan en UTC; en pantalla siempre se muestran en hora de Lima: "2026-11-09 16:57". */
function fechaLima(iso) {

/* Periodo legible: "01–31 oct 2026 (mensual)" / "01–15 nov 2026 (quincenal)". Recibe "2026-10-01 (MENSUAL)" o (desde, tipo). */
function textoEmision(txt, tipo) {
  var d = String(txt || ''), t = tipo;
  var m = d.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s*\((\w+)\))?/);

    return (i0.getUTCDate() < 10 ? '0' : '') + i0.getUTCDate() + ' ' + cs[i0.getUTCMonth()] + ' – ' + (f0.getUTCDate() < 10 ? '0' : '') + f0.getUTCDate() + ' ' + cs[f0.getUTCMonth()] + ' ' + f0.getUTCFullYear() + ' (semanal)';

function formRegla(i) {

  ['Variable alterna en un informe puntual', '<p>Si una unidad vino sin consumo con la variable principal, en el informe abre <b>Datos</b> de la unidad › «<b>Volver a extraer con variable alterna</b>». Solo se vuelve a extraer el consumo de esa unidad y solo en ese informe; el siguiente vuelve a la ECM. También puedes volver a la principal desde el mismo lugar.</p>'],
  ['Cómo se ve el PDF con varias energías', '<p>Es <b>un solo PDF</b>. Si el cliente tiene unidades de más de una energía, el PDF trae una sección por cada una (FLOTA DIÉSEL, FLOTA A GAS, FLOTA ELÉCTRICA), cada una desde una hoja nueva y con sus propias tablas, rankings, gráficas y conclusiones; la numeración de hojas es continua. Si el cliente tiene una sola energía, el PDF sale como siempre, sin rótulo.</p><ul><li><b>Gas</b>: m³, km/m³ y m³/hr (sin consumo en ralentí).</li><li><b>Eléctrico</b>: distancia, kWh en movimiento, en ralentí, regenerada y total, km/kWh, cargas (cantidad y tiempo), estado de carga inicial y final, veces bajo el 20 % y km por % de batería. Sin RPM ni sobrerrevoluciones.</li><li>El <b>ralentí</b> del informe sale de la regla de ralentí del perfil, con límite de 25 % (editable en Configuración).</li></ul>'],
  ['Configuración avanzada por unidad', '<p>El botón <b>Avanzado</b> permite, solo para esa unidad, cambiar <b>cualquiera de las 9 reglas</b> (velocidad, aceleración, frenada, giro, 3 rangos de RPM, sobrerrevoluciones, ralentí) y <b>cualquier variable de medición</b> (odómetro, combustible, horas de motor, horas de ralentí, consumo de ralentí): id del diagnóstico y unidad de origen.</p><div class="nota info">Una unidad en INACTIVO deja de traer datos desde la próxima ejecución. Además el sistema revisa MyGeotab y deja fuera sola a las unidades dadas de baja antes del periodo.</div><div class="nota">Si cambias algo y ya hay informes en curso, usa «Traer todo de nuevo» en esos informes.</div>'],
  ['Editar un cliente', '<p>Botón <b>Editar</b> (pide contraseña): correos, asunto, texto, límites de rendimiento, qué informes recibe (quincenal, mensual o ambos) o desactivarlo.</p>'],
  ['Cómo sale solo cada mes', '<p>Cada día a la hora configurada el sistema revisa: el <b>día 16</b> emite el <b>quincenal</b> (1 al 15), el <b>día 1</b> el <b>mensual</b> del mes anterior y, para los clientes con semanal, el <b>día de la semana configurado</b> la semana anterior (lunes a domingo). Cada cliente recibe solo los periodos que tiene elegidos.</p><p>Si todo está completo y correcto, <b>se envía solo</b>. Si algo falla o es dudoso queda <b>RETENIDO</b>: no se envía nada al cliente y te llega un correo a tu cuenta.</p>'],
  ['Emisión manual', '<p>En el cliente: «Nueva emisión» › tipo (mensual, quincenal o semanal) y periodo (se listan solo periodos ya cerrados, con sus fechas). Se extraen y validan los datos, pero <b>no se envía sola</b>: tú revisas y envías.</p>'],
  ['Seguir el avance', '<p><b>Emisiones</b> › abre la fila. Verás los 4 pasos (Extracción, Validación, Vista previa, Envío), la barra de avance y, al terminar bien, el mensaje verde <b>«Extracción completa: N de N unidades, N de N métricas»</b>. Si MyGeotab pide esperar, el sistema espera y sigue solo.</p>'],
  ['Corregir lo que salga mal', '<p>Si quedó RETENIDO, lee los problemas. En «Datos» de cada unidad puedes escribir un valor manual (queda marcado en el informe), quitarlo o dejar una observación. Luego «Validar de nuevo».</p><ul><li><b>Reintentar extracción</b>: repite solo lo que falló.</li><li><b>Traer todo de nuevo</b>: repite todo.</li></ul>'],
  ['Vista previa', '<p>Con la extracción completa, «Generar vista previa» crea un PDF <b>borrador</b> (uno por cliente, se reemplaza cada vez). Ábrelo y revísalo.</p>'],
  ['Enviar al cliente', '<p>«Enviar al cliente» solo se activa cuando todo está completo y verde. Envía el correo con el PDF, guarda el PDF final en la carpeta del cliente y vacía los datos de trabajo del periodo.</p><div class="nota info">Un informe enviado muestra un <b>check verde</b> ✔. Un informe ya enviado <b>no se puede enviar dos veces</b>.</div>'],
  ['La campana de avisos', '<p>Arriba a la derecha. Todo lo que necesita tu atención aparece ahí (y como número rojo en el menú): informes retenidos, envíos sin confirmar, envíos que fallaron y cortes que quedaron sin informe.</p>'],
  ['Revisar lo enviado', '<p><b>Emisiones</b> › buscador por cliente o fecha: ves destinatarios, estado, fecha de envío y el enlace al PDF. <b>Reglas</b> y <b>Configuración</b> (días de corte, hora, umbrales, textos del correo) piden la contraseña de administrador al entrar y se pueden editar solo después de ingresarla.</p>']
];
var G_FALLA = [
  ['Quedó RETENIDO (dato dudoso o faltante)', 'Abre la emisión y lee los problemas. Corrige el dato a mano o usa «Traer todo de nuevo». Luego «Validar de nuevo» → «Generar vista previa» → «Enviar al cliente».'],
  ['La extracción se detuvo o no avanza', 'Pulsa «Reintentar extracción»: retoma lo que falta sin perder lo ya traído. Si MyGeotab estuvo caído, vuelve a intentarlo cuando regrese.'],
  ['Falló el envío (por ejemplo, falta un destinatario)', 'La emisión queda LISTO y aparece en la campana. Corrige en «Editar» cliente y pulsa «Enviar al cliente» otra vez.'],
  ['Envío sin confirmar (se cortó la ejecución)', 'Revisa «Enviados» en tu Gmail. Si el correo salió, pulsa «Sí se envió». Si no salió, pulsa «No se envió» y vuelve a enviarlo.'],
  ['Pasó el corte y no hay informe', 'La campana te avisa. Elige «Crear y enviar si todo está bien» o «Crear y revisar yo».'],
  ['Cambié la configuración de una unidad', 'Usa «Traer todo de nuevo» en el informe en curso para que tome el cambio.'],
  ['Quiero rehacerlo todo de una vez', '«Reprocesar todo y enviar si queda correcto»: vuelve a consultar MyGeotab, valida y envía solo si todo queda verde. Si algo falla, queda RETENIDO sin enviar.']
];
var G_ESTADOS = [['EN_COLA', 'azul', 'Esperando su turno de extracción.'], ['EXTRAYENDO', 'azul', 'Trayendo datos de MyGeotab.'], ['RETENIDO', 'mal', 'Algo falló o es dudoso. No se envió nada.'], ['LISTO', 'aviso', 'Completo y correcto. Esperando el envío.'], ['ENVIANDO', 'azul', 'El correo está saliendo.'], ['ENVIADO', 'ok', 'Enviado ✔ (no se repite).']];
var G_ARCHIVOS = [['appsscript.json', 'Manifiesto del proyecto de Apps Script (paso 2).'], ['00_comun.gs … 09_logo.gs (12 archivos, incluye 04c_pdf_energias y 08_ampliaciones)', 'Código del sistema; van en Apps Script (paso 3).'], ['index.html', 'El panel. Va a GitHub (paso 8) con tu URL /exec pegada.'], ['logo.png', 'Logo de Navisaf. Va a GitHub junto al index.html.'], ['MODELO_CAF_LA_VIGA….pdf', 'PDF modelo de referencia. Opcional; no lo usa el panel.']];
var hechosMem = {};
function leerHechos() { var h = {}; try { h = JSON.parse(leerLocal('guiaHechos') || '{}'); } catch (e) { h = {}; } return Object.assign(h, hechosMem); }
function vistaGuia() {
  var hechos = leerHechos();
  var tabs = [['instalacion', 'Instalación (una sola vez)'], ['uso', 'Uso diario'], ['falla', 'Si algo falla'], ['ref', 'Estados y archivos']];
  var cab = '<div class="fila sep" style="margin-bottom:14px"><div class="filtros">' + tabs.map(function (t) { return '<button data-act="gTab" data-t="' + t[0] + '" class="' + (GUIA_TAB === t[0] ? 'act' : '') + '">' + t[1] + '</button>'; }).join('') + '</div></div>';
  var sinUrl = (!URL_API || URL_API.indexOf('PEGA_AQUI') === 0) ? '<div class="nota">Este panel todavía no está conectado: falta pegar tu URL <code>/exec</code> (paso 7 de la instalación). La guía funciona igual.</div>' : '';
  var cuerpo = '';
  var pasos = function (lista, clave, conChk) {
    var hechosN = lista.filter(function (_, i) { return hechos[clave + i]; }).length;
    return (conChk ? '<div class="peq" style="margin-bottom:10px">Marca cada paso cuando lo termines · ' + hechosN + ' de ' + lista.length + ' hechos</div><div class="progreso" style="margin-bottom:14px"><div style="width:' + Math.round(100 * hechosN / lista.length) + '%"></div></div>' : '') +
      lista.map(function (p, i) {
        var h = conChk && hechos[clave + i];
        return '<div class="g-paso' + (h ? ' hecho' : '') + '"><div class="g-num">' + (i + 1) + '</div><div style="flex:1;min-width:0"><h4>' + esc(p[0]) + '</h4>' + p[1] + '</div>' + (conChk ? '<label class="g-chk"><input type="checkbox" data-act="gChk" data-k="' + clave + i + '"' + (h ? ' checked' : '') + '> Hecho</label>' : '') + '</div>';
      }).join('');
  };
  if (GUIA_TAB === 'instalacion') cuerpo = sinUrl + '<div class="nota info">Hazlo con la cuenta de Google que enviará los correos. Tiempo aproximado: 30 minutos. Los archivos que necesitas son los que te entregué junto con este panel.</div>' + pasos(G_INST, 'i', true) +
    '<div class="nota">Nada de esto se probó contra tu Google real; por eso el paso 11 (prueba completa con un periodo cerrado) es obligatorio antes del último paso (modo automático).</div>';
  else if (GUIA_TAB === 'uso') cuerpo = pasos(G_USO, 'u', false);
  else if (GUIA_TAB === 'falla') cuerpo = '<div class="nota info">En cualquier fallo siempre puedes volver a extraer de MyGeotab, validar, ver la vista previa y enviar, desde el detalle de la emisión (pasos 1 al 4).</div>' + G_FALLA.map(function (f) { return '<div class="g-paso"><div class="g-num" style="background:var(--ambar);color:#1c2433">!</div><div><h4>' + esc(f[0]) + '</h4><p>' + esc(f[1]) + '</p></div></div>'; }).join('');
  else cuerpo = '<div class="tarjeta"><h2>Qué significa cada estado</h2>' + G_ESTADOS.map(function (e) { return '<div class="fila" style="margin:8px 0"><span class="chip ' + e[1] + '" style="min-width:104px;justify-content:center">' + e[0] + '</span><span>' + esc(e[2]) + '</span></div>'; }).join('') + '</div>' +
    '<div class="tarjeta"><h2>Colores de la NOTA en el PDF</h2><div class="fila"><span class="chip ok">15 a 20 · verde</span><span class="chip aviso">11 a 14 · amarillo</span><span class="chip mal">10 o menos · rojo</span></div><p class="peq">La NOTA es la suma de 6 sub-notas (1 a 5) × 2/3: sobrerrevoluciones, velocidad >80, velocidad máxima, giros, aceleraciones y frenadas. Sin eventos = 5. Si la unidad no tiene sobrerrevoluciones (eléctrico, o sin RPM) son 5 medidas × 4/5, y el máximo sigue siendo 20.</p></div>' +
    '<div class="tarjeta"><h2>Qué archivo va a dónde</h2><div class="tabla-wrap"><table><thead><tr><th>Archivo</th><th>Para qué sirve</th></tr></thead><tbody>' + G_ARCHIVOS.map(function (a) { return '<tr><td><code>' + esc(a[0]) + '</code></td><td>' + esc(a[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
    '<div class="tarjeta"><h2>Datos que conviene saber</h2><ul style="margin:0;padding-left:20px"><li>Si el primer o el último día no tiene lectura de un contador, se usa la última lectura de hasta 7 días antes y queda anotado en «Motivo».</li><li>Las credenciales de MyGeotab se guardan sin cifrar en la hoja BASES.</li><li>Un informe ENVIADO no se reenvía.</li><li>Los cambios de configuración (periodos, energía, origen, consumo, RPM) rigen desde la próxima emisión; los informes en curso terminan como empezaron.</li></ul></div>';
  $('app').innerHTML = '<div class="guia">' + cab + cuerpo + '</div>';
}

/* =============================== ACCIONES (delegación de eventos) =============================== */
var ACT = {
  gTab: function (d) { GUIA_TAB = d.t; vistaGuia(); },
  gChk: function (d, b) { var h = leerHechos(); h[d.k] = b.checked; hechosMem[d.k] = b.checked; guardarLocal('guiaHechos', JSON.stringify(h)); vistaGuia(); },
  ir: function (d) { cerrarCajon(); return ir(d.s); },
  menu: function () { $('lado').classList.toggle('abierto'); },
  avisos: function () { var c = $('cajon'); c.classList.toggle('abierto'); if (c.classList.contains('abierto')) { pintarAvisos(); return refrescarAvisos().then(pintarAvisos); } },
  cerrar: function () { cerrarModal(); },
  vista: function (d) { vistaTarjetas = d.v === 't'; guardarLocal('vista', vistaTarjetas ? 'tarjetas' : 'tabla'); document.querySelectorAll('#vt button').forEach(function (b) { b.classList.toggle('act', b.dataset.v === d.v); }); pintarClientes(); },
  nuevoCliente: function () { return nuevoCliente(); },
  editarCliente: function (d) { return editarCliente(d.id); },
  unidades: function (d) { return abrirUnidades(d.id); },
  emiManual: function (d) { return emisionManual(d.id, d.n); },
  uFiltro: function (d) { var m = pila[pila.length - 1]; leerUnidadesPantalla(m); uCtx.filtro = d.f; pintarUnidades(false); },
  uAvanzado: function (d) { unidadAvanzada(Number(d.i)); },
  actualizar: function () { return cargarEmisiones(); },
  fEstado: function (d) { filtro.estado = d.e; return cargarEmisiones(true); },
  verEmision: function (d) { cerrarCajon(); return detalleEmision(d.id); },
  reprocesar: async function (d) { if (d.run === '1' && !confirm('Hay una extracción corriendo ahora mismo. ¿Forzar de todos modos?')) return; if (!confirm('Se volverá a consultar MyGeotab, se validará y, si todo queda correcto, se enviará el PDF a ' + d.n + '. Si algo falla queda RETENIDO sin enviar. ¿Continuar?')) return; await ejecutar(function () { return api('emision_reintentar', { id: d.id, todo: true, auto: true }); }, 'Reproceso programado: se enviará solo si queda correcto'); repintarDetalle(); },
  emiAccion: async function (d) { if (d.run === '1' && !confirm('Hay una extracción corriendo ahora mismo. ¿Forzar de todos modos?')) return; await ejecutar(function () { return api(d.a, { id: d.id, todo: d.todo === '1' }); }, d.m); repintarDetalle(); },
  emiTodo: async function (d) { if (d.run === '1' && !confirm('Hay una extracción corriendo ahora mismo. ¿Forzar de todos modos?')) return; if (!confirm('¿Traer todo de nuevo? Se descartan los datos extraídos (no las correcciones manuales).')) return; await ejecutar(function () { return api('emision_reintentar', { id: d.id, todo: true }); }, 'Se traerá todo de nuevo'); repintarDetalle(); },
  generar: async function (d) { toast('Generando la vista previa, puede tardar un minuto…'); var r = await ejecutar(function () { return api('emision_generar', { id: d.id }); }); if (r) { toast('Vista previa lista', 'ok'); window.open(r.url, '_blank', 'noopener'); repintarDetalle(); } },
  enviar: async function (d) { if (!confirm('¿Enviar el informe a ' + d.n + '? Esta acción no se puede repetir.')) return; var r = await ejecutar(function () { return api('emision_enviar', { id: d.id }); }); repintarDetalle(); if (r) toast('Informe enviado ✔', 'ok'); },
  envioSi: async function (d) { var r = await ejecutar(function () { return api('envio_resolver', { id: d.id, enviado: true }); }, 'Confirmado: queda como ENVIADO'); if (r) { repintarDetalle(); } },
  envioNo: async function (d) { var r = await ejecutar(function () { return api('envio_resolver', { id: d.id, enviado: false }); }, 'Vuelve a LISTO para enviarlo de nuevo'); if (r) { repintarDetalle(); } },
  crearAviso: async function (d) { var a = avisosCache[Number(d.i)]; var r = await ejecutar(function () { return api('emision_crear', { cliente_id: a.cliente_id, tipo: a.crear.tipo, anio: a.crear.anio, mes: a.crear.mes, desde: a.crear.desde || undefined, auto: d.auto === '1' }); }); if (r) { toast(r.mensaje, 'ok'); refrescarAvisos(); } },
  datosUnidad: function (d) { datosUnidad(d.id, d.p); },
  corregir: async function (d) { var v = document.getElementById('k_' + d.m).value; var r = await ejecutar(function () { return api('dato_corregir', { id: d.id, placa: d.p, metrica: d.m, valor: v }); }, 'Corregido y validado de nuevo'); if (r) { await repintarDetalle(); cerrarModal(); datosUnidad(d.id, d.p); } },
  restaurar: async function (d) { var r = await ejecutar(function () { return api('dato_restaurar', { id: d.id, placa: d.p, metrica: d.m }); }, 'Valor manual quitado'); if (r) { await repintarDetalle(); cerrarModal(); datosUnidad(d.id, d.p); } },
  alterna: async function (d) {
    var vol = d.volver === '1';
    if (!confirm(vol ? '¿Volver a la variable principal (ECM) de ' + d.p + ' en este informe? Se vuelve a extraer solo el consumo de esa unidad.' : '¿Volver a extraer el consumo de ' + d.p + ' con la variable alterna del dispositivo? Aplica solo a este informe; el próximo vuelve a la ECM. Se vuelve a extraer solo el consumo de esa unidad.')) return;
    var r = await ejecutar(function () { return api('emision_alterna', { id: d.id, placa: d.p, volver: vol }); }, vol ? 'Se vuelve a la variable principal' : 'Se extraerá con la variable alterna');
    if (r) { cerrarModal(); repintarDetalle(); }
  },
  obs: async function (d) { var r = await ejecutar(function () { return api('obs_guardar', { id: d.id, placa: d.p, texto: document.getElementById('k_obs').value }); }, 'Observación guardada'); if (r) { cerrarModal(); repintarDetalle(); } },
  formBase: function (d) { formBase(d.i === undefined ? undefined : Number(d.i)); },
  borrarBase: async function (d) { var b = cache.basesAdm[Number(d.i)]; if (!confirm('¿Eliminar la base «' + b.nombre + '»?')) return; var r = await ejecutar(function () { return api('admin_base_eliminar', { id: b.id }, adminClave); }, 'Eliminada'); if (r) recargarBases(); },
  formRegla: function (d) { formRegla(d.i === undefined ? undefined : Number(d.i)); },
  borrarRegla: async function (d) { var r = cache.reglas.reglas[Number(d.i)]; if (!confirm('¿Quitar la regla «' + r.nombre + '»?')) return; var o = await ejecutar(function () { return api('regla_eliminar', { id_regla: r.id_regla }, adminClave); }, 'Regla quitada'); if (o) vistaReglas(true); },
  formPerfil: function (d) { formPerfil(d.i === undefined ? undefined : Number(d.i)); },
  borrarPerfil: async function (d) { var p = cache.perfiles.perfiles[Number(d.i)]; if (!confirm('¿Quitar el perfil «' + p.perfil + '»?')) return; var o = await ejecutar(function () { return api('perfil_eliminar', { perfil: p.perfil }, adminClave); }, 'Perfil quitado'); if (o) vistaReglas(true); },
  guardarDiag: function (d, b) { var tr = b.closest('tr'); return ejecutar(function () { return api('diagnostico_guardar', { diagnostico: { clave: tr.getAttribute('data-k'), id_diagnostico: tr.querySelector('.d_id').value, unidad_origen: tr.querySelector('.d_un').value } }, adminClave); }, 'Diagnóstico guardado'); }
};
function cerrarCajon() { $('cajon').classList.remove('abierto'); }
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  if (b.classList.contains('cargando')) return;   // ya está trabajando: evita el doble clic
  lanzar(b, function () { return f(b.dataset, b, e); });
});
$('q').addEventListener('input', function () {
  if (seccion === 'clientes') pintarClientes();
  else if (seccion === 'emisiones') { filtro.q = this.value; clearTimeout(ACT._t); ACT._t = setTimeout(function () { cargarEmisiones(true); }, 350); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape') { if (pila.length && pila[pila.length - 1].dataset.fijo !== '1') cerrarModal(); else cerrarCajon(); }
});

/* ---------- arranque ---------- */
pintarNav(); ir('clientes'); refrescarAvisos();
setInterval(refrescarAvisos, 20000);
</script>
</body>
</html>
